name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Traceability (tests named with R-xx)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm traceability

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Start Supabase (database and auth only)
        run: supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Schema tests
        run: supabase test db

      - name: Roll back and apply again
        run: bash supabase/scripts/rollback-check.sh

      - name: Schema tests after applying again
        run: supabase test db

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase (database, auth, API, mail and realtime)
        run: supabase start -x storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # The local stack's URL and public key; they are fixed demo values, not secrets.
      - name: Point the app at the local Supabase
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          url=$(grep -E '^API_URL=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')
          key=$(grep -E '^(PUBLISHABLE_KEY|ANON_KEY)=' "$RUNNER_TEMP/supabase.env" | head -1 | cut -d= -f2- | tr -d '"')
          [ -n "$url" ] && [ -n "$key" ] || { echo "Could not read the local Supabase URL and key"; exit 1; }
          echo "NEXT_PUBLIC_SUPABASE_URL=$url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key" >> "$GITHUB_ENV"
          service=$(grep -E '^(SERVICE_ROLE_KEY|SECRET_KEY)=' "$RUNNER_TEMP/supabase.env" | head -1 | cut -d= -f2- | tr -d '"')
          [ -n "$service" ] || { echo "Could not read the local service key"; exit 1; }
          echo "SUPABASE_SERVICE_ROLE_KEY=$service" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Install the browser
        run: pnpm --filter @chartdown/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @chartdown/web exec playwright test e2e/tour.spec.ts

      - name: Keep the tour
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tour
          path: apps/web/tour

      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
