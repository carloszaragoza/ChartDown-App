<!doctype html><html lang="en"><head><meta charset="utf-8"><style>:root{--ground:#eef1f4;--paper:#fbfcfd;--ink:#16212c;--ink-muted:#566574;--ink-inverse:#fbfcfd;--rule:#b4bec8;--control-border:#7d8a97;--md:#b8322a;--dynamic:#1f4fa8;--focus:#1f4fa8;--font-num:"Barlow Condensed", "Arial Narrow", sans-serif;--font-ui:"Source Sans 3", "Segoe UI", system-ui, sans-serif;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-10:40px;--radius-none:0;--radius-sm:4px;--radius-md:6px;--bar-line:3px;--bar-line-light:2px;--hairline:1px;--target-min:44px;--bar-height:128px;--bar-height-sm:64px}</style></head><body>
<!-- @dsCard group="Actions" height=150 subtitle="Primary, secondary, instrument selector, with icons beside the text" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,700&display=swap">
<style>
body{margin:0;background:var(--paper);font-family:var(--font-ui)}
.wrap{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:24px}
button{display:inline-flex;align-items:center;gap:8px;min-height:var(--target-min);padding:0 18px;border-radius:var(--radius-md);font:600 16px var(--font-ui);cursor:pointer}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.primary{background:var(--ink);color:var(--ink-inverse);border:0}
.secondary{background:var(--paper);color:var(--ink);border:1px solid var(--control-border)}
.view{background:var(--paper);color:var(--md);border:1.5px solid var(--md)}
.lbl{font-size:15px;color:var(--ink-muted)}
</style>
<div class="wrap">
  <button type="button" class="secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>Previous</button>
  <button type="button" class="primary">Next<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
  <span class="lbl">View as</span>
  <button type="button" class="view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c3-5.5 17-5.5 20 0-3 5.5-17 5.5-20 0Z"/><circle cx="12" cy="12" r="3"/></svg>Keys</button>
  <button type="button" class="secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download set</button>
</div>

</body></html>
