<!doctype html><html lang="en"><head><meta charset="utf-8"><style>:root{--ground:#eef1f4;--paper:#fbfcfd;--ink:#16212c;--ink-muted:#566574;--ink-inverse:#fbfcfd;--rule:#b4bec8;--control-border:#7d8a97;--md:#b8322a;--dynamic:#1f4fa8;--focus:#1f4fa8;--font-num:"Barlow Condensed", "Arial Narrow", sans-serif;--font-ui:"Source Sans 3", "Segoe UI", system-ui, sans-serif;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-10:40px;--radius-none:0;--radius-sm:4px;--radius-md:6px;--bar-line:3px;--bar-line-light:2px;--hairline:1px;--target-min:44px;--bar-height:128px;--bar-height-sm:64px}</style></head><body>
<!-- @dsCard group="Foundations" height=410 subtitle="Original stroke icons, 24px grid, 1.75px line" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,700&display=swap">
<style>
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px 12px;padding:24px}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;color:var(--ink-muted)}
svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.knob{fill:var(--paper)}
.dotf{fill:var(--md);stroke:none}
.inst svg{stroke:var(--md)}
h3{grid-column:1/-1;margin:4px 0 0;font:600 14px var(--font-ui);color:var(--ink-muted)}
</style>
<div class="grid">
  <div class="item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>previous</div>
  <div class="item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>next</div>
  <div class="item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c3-5.5 17-5.5 20 0-3 5.5-17 5.5-20 0Z"/><circle cx="12" cy="12" r="3"/></svg>view-as</div>
  <div class="item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>download</div>

  <div class="item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1L19 8l-3-3L5 16Z"/><path d="m14 7 3 3"/></svg>edit</div>
  <div class="item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M6 12v8h12v-8"/></svg>share</div>
  <div class="item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle class="knob" cx="9" cy="7" r="2.25"/><circle class="knob" cx="15" cy="17" r="2.25"/></svg>settings</div>

</body></html>
